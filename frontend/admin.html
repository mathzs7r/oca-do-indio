<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Painel da Oca: Área restrita</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header id="topo-painel">
  <h1>Painel da Oca</h1>
  <div class="info-topo">
    <span id="saudacao-admin"></span>
    <button id="btn-sair" class="btn-mini">Sair</button>
  </div>
</header>

<main id="painel">
  <section class="barra-filtros">
    <h2>Pedidos</h2>
    <div class="filtros">
      <select id="filtro-status">
        <option value="">Todos</option>
        <option value="aberto">Aberto</option>
        <option value="confirmado">Confirmado</option>
        <option value="pronto">Pronto</option>
        <option value="retirado">Retirado</option>
        <option value="cancelado">Cancelado</option>
      </select>
      <button id="btn-atualizar" class="btn-mini">↻ Atualizar</button>
      <button id="btn-backup" class="btn-mini">⬇ Backup JSON</button>
    </div>
  </section>

  <section class="novo-pedido">
    <h2>Novo pedido</h2>
    <form id="form-novo-pedido">
      <div class="campo">
        <label for="np-nome">Nome</label>
        <input id="np-nome" type="text" maxlength="80" required placeholder="Nome do cliente">
      </div>
      <div class="campo">
        <label for="np-retirada">Retirada (opcional)</label>
        <select id="np-retirada">
          <option value="">Sem retirada agendada</option>
        </select>
      </div>
      <div id="np-itens"></div>
      <button type="button" id="btn-add-item" class="btn-mini">+ Adicionar produto</button>
      <div class="campo">
        <label for="np-obs">Observação (opcional)</label>
        <input id="np-obs" type="text" maxlength="500" placeholder="Ex.: tirar cebola">
      </div>
      <p id="np-msg" class="np-msg" role="status"></p>
      <button type="submit" class="btn-mini">Cadastrar pedido</button>
    </form>
  </section>

  <div id="lista-pedidos"></div>
</main>

<footer>
  <p class="assinatura">Painel exclusivo da tribo</p>
</footer>

<script src="js/admin.js"></script>
</body>
</html>
